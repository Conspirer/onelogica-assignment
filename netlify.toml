[build]
  base = "apps/frontend"
  publish = ".next"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Proxy REST API requests to backend service or tunnel
[[redirects]]
  from = "/api/*"
  to = "https://backend.onelogica.dev/api/:splat"
  status = 200
  force = false

# Fallback for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
